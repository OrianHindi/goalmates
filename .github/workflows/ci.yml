name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version input: pnpm/action-setup reads the pinned version from
      # the root package.json "packageManager" field (pnpm@11.10.0), so CI
      # can never drift from the version used locally.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # firebase-tools' emulators require a JDK 21+ runtime (the Firestore/Auth
      # emulators are JVM-based); ubuntu-latest's default `java` is older, so
      # firebase emulators:exec fails with "Java version before 21" without this.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: pnpm exec firebase emulators:exec --only firestore,auth "pnpm --filter @goalmates/shared run test:rules"
      - run: pnpm build

name: Fixture Sync

# Periodic fixture-data sync — there is no server/Cloud Functions in
# GoalMates (see docs/architecture-v1.md §0), so this workflow is the
# "cron job" that keeps fixture times/teams/scores current. Full design
# (idempotency guarantee, emulator-vs-real conditional, founder action
# needed later) is in docs/architecture-v1.md §8 — read that first if
# changing this file.
#
# Cron interval: every 10 minutes (docs/architecture-v1-amendment-livescore.md
# §4 — supersedes the original hourly cadence). This repo is now PUBLIC
# specifically to make this affordable: GitHub-hosted runners are free and
# unlimited on public repos (verified against GitHub's billing docs), so the
# ~4,400-6,600 runner-minutes/month this cadence uses costs nothing here,
# whereas the same load on a private Free-tier repo (2,000 min/mo cap) would
# be 2.5-3x over budget. The 10-minute tick itself is cheap: every run does a
# Firestore-only "is anything live right now" check first
# (scripts/sync-fixtures.ts's `anyFixtureCurrentlyLive`) and only spends any
# API-Football quota (100 requests/day free tier — the real binding
# constraint) on the runs where something actually is live. See the amendment
# doc for the full budget math (~21 req/day typical, ~61 req/day worst-case
# World-Cup-matchday, both comfortably inside 100/day).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # The `secrets` context cannot be referenced directly inside an `if:`
    # conditional (job- or step-level) — GitHub rejects the whole workflow
    # file at parse time if you try ("Unrecognized named-value: 'secrets'"),
    # which is exactly what happened here: every run since this workflow's
    # first commit failed in 0s with "likely failed because of a workflow
    # file issue" and zero jobs ever executed (confirmed via `gh run list`/
    # `gh run view` against this repo, and independently against GitHub's
    # own docs: https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets).
    # Fix: hoist the secret into a job-level `env:` var first, then branch
    # `if:` on that env var instead of `secrets` directly.
    env:
      HAS_REAL_FIREBASE_PROJECT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      # No version input: pnpm/action-setup reads the pinned version from
      # the root package.json "packageManager" field, so CI can never
      # drift from the version used locally (same as ci.yml).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # -------------------------------------------------------------
      # Real-project path — only runs once the founder has created a real
      # Firebase project and added the FIREBASE_SERVICE_ACCOUNT repo
      # secret (a Firebase service-account JSON key). Until then this
      # step is skipped entirely: no secret is required for this workflow
      # (or its CI) to pass right now.
      #
      # FIXTURE_API_KEY (also a repo secret, added alongside
      # FIREBASE_SERVICE_ACCOUNT once the founder creates an api-sports.io
      # account — docs/architecture-v1-amendment-livescore.md) is passed
      # through unconditionally: scripts/sync-fixtures.ts only switches to
      # RealFixtureSyncProvider when BOTH this real-project step is active
      # AND FIXTURE_API_KEY is actually set, so it's harmless to reference
      # here even before that secret exists (an empty secret just means the
      # script keeps using the stub, same as today).
      # -------------------------------------------------------------
      - name: Sync fixtures (real Firebase project)
        if: ${{ env.HAS_REAL_FIREBASE_PROJECT == 'true' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
          FIXTURE_API_KEY: ${{ secrets.FIXTURE_API_KEY }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          pnpm run sync-fixtures
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      # -------------------------------------------------------------
      # Default path — no real Firebase project exists yet, so there is
      # nothing real to reach. Instead, prove the script actually works by
      # running it against a throwaway emulator instance spun up and torn
      # down entirely inside this job (same `firebase emulators:exec`
      # pattern as ci.yml's rules-test step). Seeds first so there's a
      # FINISHED fixture in play to verify the sync doesn't corrupt, then
      # runs the sync script twice back-to-back to exercise idempotency —
      # the second run should report zero created/updated fixtures.
      #
      # Cadence note (docs/architecture-v1-amendment-livescore.md §4,
      # "workflow-shape note for the follow-up implementer" — this is that
      # follow-up): booting a JVM-based emulator every 10 minutes (144x/day)
      # to prove idempotency is wasteful even though it's free on a public
      # repo, so this dry-run only actually runs on `workflow_dispatch`
      # (manual test) or once per hour (the first 10-minute tick of each
      # hour, via the wall-clock minute check in the "Determine cadence"
      # step below) — every other 10-minute tick in this default (no real
      # project) path is a fast, near-instant no-op that still proves
      # checkout/install stayed green.
      # -------------------------------------------------------------
      - name: Determine cadence
        id: cadence
        if: ${{ env.HAS_REAL_FIREBASE_PROJECT == 'false' }}
        run: |
          minute=$(date -u +%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$((10#$minute))" -lt 10 ]; then
            echo "run_dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: ${{ env.HAS_REAL_FIREBASE_PROJECT == 'false' && steps.cadence.outputs.run_dry_run == 'true' }}
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync fixtures (emulator dry run — no real project yet)
        if: ${{ env.HAS_REAL_FIREBASE_PROJECT == 'false' && steps.cadence.outputs.run_dry_run == 'true' }}
        run: |
          pnpm exec firebase emulators:exec --only firestore,auth \
            "pnpm seed && pnpm run sync-fixtures && pnpm run sync-fixtures"

      - name: Skip (default path, not the hourly dry-run tick)
        if: ${{ env.HAS_REAL_FIREBASE_PROJECT == 'false' && steps.cadence.outputs.run_dry_run == 'false' }}
        run: echo "No real Firebase project yet and not this hour's dry-run tick — nothing to do this run."

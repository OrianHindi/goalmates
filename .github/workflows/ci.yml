name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version input: pnpm/action-setup reads the pinned version from
      # the root package.json "packageManager" field (pnpm@11.10.0), so CI
      # can never drift from the version used locally.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec firebase emulators:exec --only firestore,auth "pnpm --filter @goalmates/shared run test:rules"
      - run: pnpm build
